<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Realm of Reckoning</title>
  <meta name="description" content="A medieval mathematics adventure from KS1 to University: travel between cities, learn from the court, and pass each city's exam.">
  <meta name="theme-color" content="#1b130d">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topbar" hidden>
    <button id="home-btn" class="brand" aria-label="Back to the map">⚜ <span>Realm of Reckoning</span></button>
    <div class="tb-right">
      <button id="sound-btn" class="icon-btn" aria-label="Toggle sound">♪</button>
      <button id="hearts-btn" class="hearts-btn" aria-label="Lives">
        <span id="hearts"></span><span id="life-timer" hidden></span>
      </button>
    </div>
  </header>
  <main id="app"></main>
  <div id="modal-root"></div>

  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/content/ks1.js"></script>
  <script src="js/content/ks2.js"></script>
  <script src="js/content/gcse.js"></script>
  <script src="js/content/alevel.js"></script>
  <script src="js/content/university.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
